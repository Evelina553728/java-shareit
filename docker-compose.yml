services:
  db:
    image: postgres:16.1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shareit"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shareit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  gateway:
    build: ./gateway
    network_mode: host
    depends_on:
      - server
    environment:
      SHAREIT_SERVER_URL: http://localhost:9090